<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Place Called Us</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <p class="moon">☾</p>

        <h1 class="title">A Place Called Us</h1>

        <p class="quote">
            Some places exist on maps.
            <br>
            Some exist only because two hearts found each other.
        </p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Our little secret..."
            >

            <button id="unlockButton">
                ♡ Unlock ♡
            </button>

        </div>

    </div>

    <div class="welcome-screen" id="welcomeScreen">

        <h2>
            Welcome home,
            <br>
            Baba.
        </h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
